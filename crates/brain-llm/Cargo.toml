[package]
name = "brain-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "LLM transport clients (Anthropic, OpenAI) for Brain's LLM extractor tier."

[dependencies]
blake3 = { workspace = true }
# Cache guard for the broker resolver's per-namespace entries. Workspace-wide
# already; no new download.
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
# `rt-multi-thread` + `net`: the broker resolver owns a small runtime so its
# hyper-based HTTP has a reactor, because its caller runs on glommio (#34).
tokio = { workspace = true, features = ["time", "rt-multi-thread", "net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "tokio"] }
http-body-util.workspace = true
